<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MMT Scan</title>
<!-- Keep it out of search results. Not security - the page holds nothing worth
     having - but there is no reason for it to be findable. -->
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta name="googlebot" content="noindex, nofollow">
<!--
  MMT SCANNER

  This page exists for one reason. Apps Script serves its web apps inside a
  sandboxed iframe on an opaque googleusercontent.com origin, and browsers
  refuse camera access from there no matter what the user taps. Google changed
  this in February 2026 and it cannot be fixed from inside Apps Script.

  So the camera lives out here instead, on an origin we control, where the
  browser will allow it. All this page does is read a QR code and send the
  browser on to the MMT app with the part number attached.

  It holds nothing. No sheet access, no credentials, no API secret. If a
  stranger found this page the worst they could do is scan their own QR codes.
  The app itself is still locked to company Google accounts, so the redirect
  lands them on a sign-in wall.
-->
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    margin: 0; background: #0d0d0f; color: #fff;
    font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    display: flex; flex-direction: column;
    padding: env(safe-area-inset-top) env(safe-area-inset-right)
             env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  header {
    padding: 14px 16px 10px; font-size: 17px; font-weight: 700;
    letter-spacing: .5px; flex: 0 0 auto;
  }
  header span { color: #C8102E; }
  #wrap { flex: 1 1 auto; position: relative; overflow: hidden; }
  video { width: 100%; height: 100%; object-fit: cover; background: #000; display: block; }
  /* The window the operator lines the label up in. */
  #frame {
    position: absolute; inset: 0; display: flex;
    align-items: center; justify-content: center; pointer-events: none;
  }
  #picks { pointer-events: none; }
  .pick { pointer-events: auto; }
  #box {
    width: 68vw; max-width: 320px; aspect-ratio: 1;
    border: 3px solid rgba(255,255,255,.9); border-radius: 18px;
    box-shadow: 0 0 0 100vmax rgba(0,0,0,.45);
  }
  #box.hit { border-color: #1e7e34; }
  /* With more than one label in view, a marker is put on each one and nothing
     happens until one is tapped - guessing which was meant is worse. */
  #picks { position: absolute; inset: 0; }
  .pick {
    position: absolute; transform: translate(-50%, -50%);
    background: #C8102E; color: #fff; border: 3px solid #fff;
    border-radius: 12px; padding: 10px 14px; font-size: 16px; font-weight: 700;
    font-family: ui-monospace, Menlo, Consolas, monospace;
    box-shadow: 0 2px 10px rgba(0,0,0,.6); white-space: nowrap;
  }
  footer { flex: 0 0 auto; padding: 14px 16px 20px; }
  #msg { text-align: center; font-size: 15px; min-height: 22px; margin-bottom: 10px; }
  #msg b { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 19px; }
  button, a.btn {
    display: block; width: 100%; padding: 15px; font-size: 16px; font-weight: 600;
    border: 0; border-radius: 10px; margin-top: 8px; text-align: center;
    text-decoration: none; font-family: inherit;
  }
  .primary { background: #C8102E; color: #fff; }
  .ghost { background: #2a2a30; color: #fff; }
  .err {
    background: #3a1a1a; border-left: 4px solid #C8102E; padding: 12px;
    border-radius: 6px; font-size: 14px; line-height: 1.5; text-align: left;
  }
  input {
    width: 100%; padding: 14px; font-size: 17px; border-radius: 10px;
    border: 1px solid #444; background: #1a1a1f; color: #fff; margin-top: 8px;
    font-family: ui-monospace, Menlo, Consolas, monospace;
  }
  .hide { display: none !important; }
</style>
</head>
<body>

<header>MMT <span>SCAN</span></header>

<div id="wrap">
  <video id="vid" playsinline muted autoplay></video>
  <canvas id="cv" class="hide"></canvas>
  <div id="frame"><div id="box"></div></div>
  <div id="picks"></div>
</div>

<footer>
  <div id="msg">Starting the camera...</div>
  <div id="fallback" class="hide">
    <input id="manual" inputmode="text" value="MMT-1" autocomplete="off">
    <button class="primary" onclick="go(document.getElementById('manual').value)">Open it</button>
  </div>
  <a class="btn ghost" id="appLink" href="#">Back to the app</a>
</footer>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script>
// ---------------------------------------------------------------------------
// The one thing to set. Paste the MMT app deployment URL here - the AKfycbxWVR
// one that is printed on the labels, NOT the machine API.
// ---------------------------------------------------------------------------
var APP_URL = 'https://script.google.com/a/macros/maurermachinetools.com.au/s/AKfycbxWVR-ggvEOvFWk3y73_TjXpD19T1D2SxfVNiUQ0FZ_SVTmIsiQVJQnOV5uJsq5VB1V/exec';
// ---------------------------------------------------------------------------

var $ = function (id) { return document.getElementById(id); };
var stream = null, raf = null, sent = false;

$('appLink').href = APP_URL;

function go(text) {
  if (sent) return;
  var m = String(text || '').toUpperCase().match(/MMT-\d+/);
  if (!m) {
    $('msg').innerHTML = 'That is not an MMT part number.';
    return;
  }
  sent = true;
  stop();
  $('box').classList.remove('near');
  $('box').classList.add('hit');
  $('msg').innerHTML = 'Opening <b>' + m[0] + '</b>';
  // Same tab, every time. This is the whole point - the phone camera app opens
  // a new tab per scan and they pile up all day.
  window.location.replace(APP_URL + '?part=' + encodeURIComponent(m[0]));
}

function stop() {
  if (raf) { cancelAnimationFrame(raf); raf = null; }
  if (stream) { stream.getTracks().forEach(function (t) { t.stop(); }); stream = null; }
}

// Where a code sits on screen.
//
// The reader works on a small copy of the frame, and the video is cropped to
// fill the window, so the same maths the browser uses for object-fit: cover is
// needed to put a marker in the right place.
function onScreen(loc, cw, ch) {
  var v = $('vid'), wrap = $('wrap');
  var vw = v.videoWidth, vh = v.videoHeight;
  var cx = (loc.topLeftCorner.x + loc.topRightCorner.x +
            loc.bottomLeftCorner.x + loc.bottomRightCorner.x) / 4;
  var cy = (loc.topLeftCorner.y + loc.topRightCorner.y +
            loc.bottomLeftCorner.y + loc.bottomRightCorner.y) / 4;
  var fx = cx * (vw / cw), fy = cy * (vh / ch);
  var W = wrap.clientWidth, H = wrap.clientHeight;
  var scale = Math.max(W / vw, H / vh);
  return { x: fx * scale + (W - vw * scale) / 2,
           y: fy * scale + (H - vh * scale) / 2 };
}

// jsQR only ever returns one code per picture. So it is run, the code it found
// is painted over, and it is run again - until nothing is left. That is how
// several labels in one shot are found.
//
// Every pass costs time, and reading six of them on every frame made the thing
// sluggish to pick up anything at all. So it stops after two unless a second
// code actually turns up, which is the only time the rest are needed.
function readAll(ctx, w, h, maxPasses) {
  var out = [];
  for (var pass = 0; pass < (maxPasses || 2); pass++) {
    var d = ctx.getImageData(0, 0, w, h);
    var code = window.jsQR ? window.jsQR(d.data, w, h, { inversionAttempts: 'attemptBoth' }) : null;
    if (!code || !code.data) break;
    var m = String(code.data).toUpperCase().match(/MMT-\d+/);
    var l = code.location;
    var xs = [l.topLeftCorner.x, l.topRightCorner.x, l.bottomLeftCorner.x, l.bottomRightCorner.x];
    var ys = [l.topLeftCorner.y, l.topRightCorner.y, l.bottomLeftCorner.y, l.bottomRightCorner.y];
    var x0 = Math.min.apply(null, xs), x1 = Math.max.apply(null, xs);
    var y0 = Math.min.apply(null, ys), y1 = Math.max.apply(null, ys);
    if (m && !out.some(function (o) { return o.pn === m[0]; })) {
      out.push({ pn: m[0], loc: l });
    }
    // Paint it out, with a margin, so the next pass finds a different one.
    var pad = 6;
    ctx.fillStyle = '#fff';
    ctx.fillRect(x0 - pad, y0 - pad, (x1 - x0) + pad * 2, (y1 - y0) + pad * 2);
  }
  return out;
}

function clearPicks() { $('picks').innerHTML = ''; }

function showPicks(list, cw, ch) {
  var box = $('picks');
  box.innerHTML = '';
  list.forEach(function (c) {
    var p = onScreen(c.loc, cw, ch);
    var el = document.createElement('div');
    el.className = 'pick';
    el.style.left = p.x + 'px';
    el.style.top = p.y + 'px';
    el.textContent = c.pn;
    el.addEventListener('click', function () { go(c.pn); });
    box.appendChild(el);
  });
}

function tick() {
  var v = $('vid'), c = $('cv');
  if (!stream) return;
  if (v.readyState === v.HAVE_ENOUGH_DATA) {
    // Read at a sane size. Full sensor resolution is slow on a tablet and no
    // more accurate for a code this big in frame.
    // A bigger picture reads a label from further away. 640 was too small for
    // a bin label at arm's length.
    var w = 960, h = Math.round(v.videoHeight / v.videoWidth * 960) || 720;
    c.width = w; c.height = h;
    var ctx = c.getContext('2d', { willReadFrequently: true });
    ctx.drawImage(v, 0, 0, w, h);
    try {
      // Two passes: enough to tell one label from several, and quick enough to
      // keep up with the camera.
      var found = readAll(ctx, w, h, 2);
      if (found.length === 1) { go(found[0].pn); return; }
      if (found.length > 1) {
        // Now it is worth looking properly for the rest.
        ctx.drawImage(v, 0, 0, w, h);
        found = readAll(ctx, w, h, 6);
      }
      if (found.length === 1) { go(found[0].pn); return; }
      if (found.length > 1) {
        $('box').style.opacity = '0';
        showPicks(found, w, h);
        $('msg').innerHTML = found.length + ' labels - tap the one you want';
      } else {
        clearPicks();
        $('box').style.opacity = '';
        $('msg').innerHTML = 'Point at the label';
      }
    } catch (e) { /* a dropped frame is nothing to stop for */ }
  }
  raf = requestAnimationFrame(tick);
}

function fail(title, detail) {
  stop();
  $('msg').innerHTML = '<div class="err"><b style="font-size:15px">' + title +
                       '</b><br>' + detail + '</div>';
  $('fallback').classList.remove('hide');
}

function start() {
  if (APP_URL.indexOf('http') !== 0) {
    fail('Not set up yet', 'APP_URL still needs the MMT app link pasted into it.');
    return;
  }
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    fail('No camera here', 'This browser will not give a web page camera access. ' +
         'Type the part number instead.');
    return;
  }
  navigator.mediaDevices.getUserMedia({
    video: {
      facingMode: { ideal: 'environment' },
      width: { ideal: 1920 },
      height: { ideal: 1080 },
      // Keep it focusing. A fixed focus is why a label has to be held at
      // exactly the right distance to be read.
      advanced: [{ focusMode: 'continuous' }]
    },
    audio: false
  }).then(function (s) {
    stream = s;
    var v = $('vid');
    v.srcObject = s;
    v.setAttribute('playsinline', true);
    return v.play();
  }).then(function () {
    $('msg').innerHTML = 'Point at the label';
    tick();
  }).catch(function (e) {
    var n = e && e.name ? e.name : '';
    if (n === 'NotAllowedError') {
      fail('Camera blocked',
           'Allow the camera for this page: tap the padlock in the address bar, ' +
           'then Permissions, then Camera, then Allow. Reload afterwards.');
    } else if (n === 'NotFoundError' || n === 'OverconstrainedError') {
      fail('No camera found', 'Nothing on this device reported a back camera.');
    } else {
      fail('Camera would not start', n || 'Unknown error.');
    }
  });
}

// Give back the camera when the tablet is put down, and pick it up again on
// return. A stream left running flattens the battery and locks the camera out
// of every other app.
document.addEventListener('visibilitychange', function () {
  if (document.hidden) { stop(); }
  else if (!sent && !stream) { start(); }
});

start();
</script>
</body>
</html>
